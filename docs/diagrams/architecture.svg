<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450" role="img" aria-labelledby="title desc">
<title id="title">NavGate proposed engineering architecture</title><desc id="desc">Native Android phone with local routing, local storage and shared navigation session. Map tiles and pack updates are optional external resources. Proposal, not implemented.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526476"/></marker></defs>
<rect width="1200" height="1450" fill="#f5f7fa"/>
<text x="44" y="48" font-family="Arial, sans-serif" font-size="30" fill="#142b40" font-weight="700">NavGate / proposed engineering architecture</text>
<text x="44" y="80" font-family="Arial, sans-serif" font-size="16" fill="#142b40" font-weight="400">18 OCT 2026  |  REVIEW DRAFT  |  Kotlin  |  Zero paid-service dependency</text>
<text x="44" y="116" font-family="Arial, sans-serif" font-size="18" fill="#142b40" font-weight="400">Core campus operation runs on the phone. Remote services are optional.</text>
<rect x="30" y="144" width="1140" height="1000" rx="14" fill="#eaf0f5" stroke="#8198ae"/>
<text x="52" y="176" font-family="Arial, sans-serif" font-size="19" fill="#142b40" font-weight="700">ANDROID PHONE — proposed runtime</text>
<rect x="330" y="198" width="540" height="95" rx="10" fill="#ffffff" stroke="#acbac8"/>
<text x="348" y="227" font-family="Arial, sans-serif" font-size="18" fill="#142b40" font-weight="700">Compose screens + ViewModel</text>
<text x="348" y="253" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Explore &gt; Place details &gt; Route preview &gt; Navigation</text>
<text x="348" y="276" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">User events flow down; immutable state flows back.</text>
<path d="M600 293 L600 330" stroke="#526476" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="330" y="330" width="540" height="110" rx="10" fill="#ffffff" stroke="#acbac8"/>
<text x="348" y="359" font-family="Arial, sans-serif" font-size="18" fill="#142b40" font-weight="700">RoutePlanner</text>
<text x="348" y="385" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Validate region, origin, destination entrance and profile.</text>
<text x="348" y="408" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Cancel stale requests; return Ready or Unavailable.</text>
<rect x="55" y="330" width="245" height="110" rx="10" fill="#ffffff" stroke="#acbac8"/>
<text x="73" y="359" font-family="Arial, sans-serif" font-size="18" fill="#142b40" font-weight="700">Room / SQLite</text>
<text x="73" y="385" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Places + local search</text>
<text x="73" y="408" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Versioned graph records</text>
<text x="73" y="431" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Saved places + trip history</text>
<path d="M300 382 L330 382" stroke="#526476" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M600 440 L600 478" stroke="#526476" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="330" y="478" width="540" height="110" rx="10" fill="#ffffff" stroke="#acbac8"/>
<text x="348" y="507" font-family="Arial, sans-serif" font-size="18" fill="#142b40" font-weight="700">CampusRoutingProvider / A*</text>
<text x="348" y="533" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Read immutable active graph and permitted directed edges.</text>
<text x="348" y="556" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Return route geometry, maneuvers and provenance.</text>
<rect x="900" y="478" width="245" height="110" rx="10" fill="#ffffff" stroke="#acbac8"/>
<text x="918" y="507" font-family="Arial, sans-serif" font-size="18" fill="#142b40" font-weight="700">Graph snapshot</text>
<text x="918" y="533" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Adjacency + spatial index</text>
<text x="918" y="556" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Reviewed paths / entrances</text>
<text x="918" y="579" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Pinned graph version</text>
<path d="M900 532 L870 532" stroke="#526476" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M600 588 L600 630" stroke="#526476" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="330" y="630" width="540" height="130" rx="10" fill="#ffffff" stroke="#acbac8"/>
<text x="348" y="659" font-family="Arial, sans-serif" font-size="18" fill="#142b40" font-weight="700">NavigationSession — single trip owner</text>
<text x="348" y="685" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Start / stop / progress / signal limits / reroute / arrive</text>
<text x="348" y="708" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">One serialized event stream; session and request IDs.</text>
<text x="348" y="731" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Publishes the same state to map, camera and voice.</text>
<rect x="55" y="625" width="245" height="135" rx="10" fill="#ffffff" stroke="#acbac8"/>
<text x="73" y="654" font-family="Arial, sans-serif" font-size="18" fill="#142b40" font-weight="700">PositionProcessor</text>
<text x="73" y="680" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Android LocationManager</text>
<text x="73" y="703" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Fix age + horizontal accuracy</text>
<text x="73" y="726" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Project onto route segments</text>
<text x="73" y="749" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Sustained deviation checks</text>
<path d="M300 690 L330 690" stroke="#526476" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="900" y="630" width="245" height="130" rx="10" fill="#ffffff" stroke="#acbac8"/>
<text x="918" y="659" font-family="Arial, sans-serif" font-size="18" fill="#142b40" font-weight="700">HeadingSource</text>
<text x="918" y="685" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">SensorManager</text>
<text x="918" y="708" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Rotation + true bearing</text>
<text x="918" y="731" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Circular heading smoothing</text>
<text x="918" y="754" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Accuracy / unavailable state</text>
<path d="M900 690 L870 690" stroke="#526476" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M445 760 L210 835" stroke="#526476" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M600 760 L600 835" stroke="#526476" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<path d="M750 760 L1020 835" stroke="#526476" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="55" y="835" width="310" height="105" rx="10" fill="#ffffff" stroke="#acbac8"/>
<text x="73" y="864" font-family="Arial, sans-serif" font-size="18" fill="#142b40" font-weight="700">Map presentation</text>
<text x="73" y="890" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">MapLibre route and markers</text>
<text x="73" y="913" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Online or installed basemap</text>
<rect x="405" y="835" width="390" height="105" rx="10" fill="#ffffff" stroke="#acbac8"/>
<text x="423" y="864" font-family="Arial, sans-serif" font-size="18" fill="#142b40" font-weight="700">Optional camera assistance</text>
<text x="423" y="890" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">CameraX + heading alignment</text>
<text x="423" y="913" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Directional HUD; no world-anchor claim</text>
<rect x="835" y="835" width="310" height="105" rx="10" fill="#ffffff" stroke="#acbac8"/>
<text x="853" y="864" font-family="Arial, sans-serif" font-size="18" fill="#142b40" font-weight="700">Optional voice</text>
<text x="853" y="890" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Android TextToSpeech</text>
<text x="853" y="913" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Installed offline voice or text fallback</text>
<rect x="55" y="984" width="1090" height="120" rx="10" fill="#ffffff" stroke="#acbac8"/>
<text x="73" y="1013" font-family="Arial, sans-serif" font-size="18" fill="#142b40" font-weight="700">RegionPackInstaller + local storage lifecycle</text>
<text x="73" y="1039" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Bundled routing pack &gt; staging &gt; signature/schema/topology checks &gt; transactional activation</text>
<text x="73" y="1062" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Each active trip pins its graph version. Bad updates leave the previous pack intact.</text>
<text x="73" y="1085" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Routing data and offline basemap resources are separate installations.</text>
<path d="M75 984 L40 984 L40 455 L177 455 L177 440" stroke="#526476" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="52" y="1126" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Solid arrows: core flow / reads     Dashed arrows: optional network resources</text>
<rect x="45" y="1190" width="345" height="120" rx="10" fill="#e4edf8" stroke="#acbac8"/>
<text x="63" y="1219" font-family="Arial, sans-serif" font-size="18" fill="#142b40" font-weight="700">OpenFreeMap</text>
<text x="63" y="1245" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Optional online map tiles</text>
<text x="63" y="1268" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">No API key; current free public service</text>
<text x="63" y="1291" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Offline downloads subject to terms</text>
<rect x="425" y="1190" width="345" height="120" rx="10" fill="#e4edf8" stroke="#acbac8"/>
<text x="443" y="1219" font-family="Arial, sans-serif" font-size="18" fill="#142b40" font-weight="700">Reviewed pack releases</text>
<text x="443" y="1245" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Optional signed data updates</text>
<text x="443" y="1268" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Bundled pack works without server</text>
<text x="443" y="1291" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Manual import / APK update initially</text>
<rect x="805" y="1190" width="345" height="120" rx="10" fill="#e4edf8" stroke="#acbac8"/>
<text x="823" y="1219" font-family="Arial, sans-serif" font-size="18" fill="#142b40" font-weight="700">Later city-routing adapter</text>
<text x="823" y="1245" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Evaluate BRouter or existing Go stack</text>
<text x="823" y="1268" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">Not a campus runtime dependency</text>
<text x="823" y="1291" font-family="Arial, sans-serif" font-size="15" fill="#142b40" font-weight="400">No integration claimed in this draft</text>
<path d="M210 1190 L20 1190 L20 887 L55 887" stroke="#526476" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<path d="M597 1190 L597 1104" stroke="#526476" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="45" y="1360" font-family="Arial, sans-serif" font-size="18" fill="#142b40" font-weight="700">First proposed scope: bounded KIIT outdoor walking; physically verified entrances and connections.</text>
<text x="45" y="1392" font-family="Arial, sans-serif" font-size="17" fill="#142b40" font-weight="400">City driving, background guidance, indoor localization and world-anchored AR need separate evidence.</text>
<text x="45" y="1422" font-family="Arial, sans-serif" font-size="17" fill="#142b40" font-weight="400">A place list is not a routing graph. An unavailable route must never turn into synthetic guidance.</text>
</svg>